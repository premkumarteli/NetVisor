# Bandit configuration file for NetVisor
# Configures exclusions for static code analysis to prevent false positives

skips:
  - B311  # Standard pseudo-random generators (used for jitter/polling backoff, not cryptography)
  - B608  # Hardcoded SQL expressions (false positives on f-strings constructing query structures)
  - B110  # Try, Except, Pass (used in resource close/cleanup exception suppression)
  - B112  # Try, Except, Continue (used in loop recovery blocks)
  - B104  # Hardcoded bind all interfaces (false positives on "0.0.0.0" literal strings used as IP defaults)
  - B101  # Assert statements (used for type assertion checks)
  - B324  # Weak hashlib (SHA1 used for flow log deduplication hashing, not cryptography/security)
  - B404  # Subprocess import (required for proxy service/probing processes management)
  - B603  # Subprocess execute without shell (safe internal executable executions)
  - B607  # Subprocess start process with partial path (e.g. system commands like certutil)
  - B105  # Hardcoded password (triggered by "last_password_change" database migration string)
  - B405  # XML parsing import (ElementTree used for device discovery description parsing)
  - B310  # urllib open (urlopen used for safe internal HTTP requests during device probing)
  - B314  # XML elementtree fromstring (used to parse standard device description XMLs)
